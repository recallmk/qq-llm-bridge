<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公开阅读与原创发布</title>
<style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#203b3e;background:#edf3f2}body{max-width:1180px;margin:32px auto;padding:0 24px}h1{font-size:30px}h2{font-size:20px;margin:0 0 15px}p{line-height:1.7}a{color:#12677b}header{display:flex;justify-content:space-between;align-items:center;gap:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}.card{background:white;border:1px solid #d2dfdc;border-radius:14px;padding:22px;margin:18px 0}.grid .card{margin:0}button,input{font:inherit;padding:9px 12px;border:1px solid #a5c1bc;border-radius:7px;background:#fff;color:inherit}button{cursor:pointer}button:hover{background:#edf6f4}button[disabled]{opacity:.5;cursor:wait}.buttons{display:flex;flex-wrap:wrap;gap:8px}small,.muted{color:#617b79}label{display:block;margin:10px 0}input{width:130px;margin-left:10px}table{width:100%;border-collapse:collapse}td,th{text-align:left;vertical-align:top;padding:10px 7px;border-bottom:1px solid #e2ebe8;font-size:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;font-family:inherit}.notice{padding:12px 16px;background:#fff0d8;border-radius:9px}details{padding:14px 0;border-bottom:1px solid #e1e9e5}summary{cursor:pointer;font-weight:600}.pill{padding:3px 8px;background:#e9f4f1;border-radius:10px}.error{color:#a24624}footer{margin:24px 0}
</style>
<header><div><h1 id="title">公开阅读与原创发布</h1><p class="muted" id="subtitle">正在读取本机状态…</p></div><a href="/fish">QQ 观测台</a></header><div id="error" class="notice" hidden></div>
<div class="grid"><section class="card"><h2>固定日程</h2><div id="schedule"></div><p class="muted">每个自然日最多补一次当日漏跑；不补跑历史多天。共享账号按明确时区的自然周合计。</p></section><section class="card"><h2>独立开关</h2><div class="buttons"><button data-action="pause-browse">暂停浏览</button><button data-action="resume-browse">恢复浏览</button><button data-action="pause-publish">暂停发布</button><button data-action="resume-publish">恢复发布</button><button data-action="check-connection">只检查登录与入口</button></div><p id="switches"></p><p class="muted">登录、验证和能力异常会暂停对应平台。此处检查不会调用模型、浏览帖子或发布内容。</p></section></div>
<section class="card"><h2>费用与处理预算</h2><p id="cost"></p><div class="buttons"><label>每日金额<input id="daily" type="number" min="0" max="100" step=".01"></label><label>每周金额<input id="weekly" type="number" min="0" max="100" step=".01"></label><label>共享后台每日<input id="shared" type="number" min="0" max="100" step=".01"></label><button id="budget">保存预算</button></div><p id="limits" class="muted"></p></section>
<section class="card"><h2>账号与连接</h2><div id="accounts"></div></section>
<section class="card"><h2>当前兴趣</h2><div id="interests"></div><p class="muted">少量经历只显示初步倾向；不同来源、作者与时间才支持稳定性。没有长期记忆也是有效结果。</p></section>
<section class="card"><h2>待处理报告</h2><div id="reports"></div></section>
<section class="card"><h2>近期任务与草稿</h2><div id="tasks"></div></section>
<section class="card"><h2>已选择的公开长期记忆</h2><div id="memories"></div></section>
<footer class="muted">本页只在本机开放。没有点赞、关注、评论、私信、直播、购物或任意电脑操作入口。已经发布的帖子不会默认删除。</footer>
<script>
let token='',data=null,working=false;
const $=id=>document.getElementById(id);
const names={pending:'待执行',running:'执行中',draft_complete:'草稿完成',pending_publish:'待发布',confirming:'结果待确认',succeeded:'成功',failed:'失败',cancelled:'取消'};
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function link(url,label){const n=el('a',label);try{const u=new URL(url);if(u.protocol==='https:'&&u.hostname==='www.xiaohongshu.com'){n.href=u.href;n.target='_blank';n.rel='noreferrer'}}catch{}return n}
async function api(route,body){const r=await fetch(route,{method:body?'POST':'GET',headers:{'x-qq-token':token,...(body?{'content-type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const v=await r.json();if(!r.ok||v.ok===false)throw Error(v.error||'读取失败');return v}
function fill(id,nodes){$(id).replaceChildren(...nodes)}
function when(slot){return slot?slot.day+' '+slot.time+' '+slot.timeZone:'—'}
function render(v){data=v;if(!v.schedule)throw Error(v.reason||'社交配置未加载');$('title').textContent=v.botName+' · 公开阅读与原创发布';$('subtitle').textContent=v.timeZone+' · 允许时段 '+v.window.join('–')+' · '+(v.busy?'后台任务进行中':'空闲');
fill('schedule',[el('p','下次固定浏览：'+when(v.schedule.browse.next)),el('p','下次固定发布：'+when(v.schedule.publish.next)),el('p','补发机会：'+when(v.schedule.retry.next))]);
$('switches').textContent='浏览：'+(v.switches.browsePaused?'已暂停':'启用')+'　发布：'+(v.switches.publishPaused?'已暂停':'启用');
$('cost').textContent=v.budget.billing==='subscription_quota'?'现有订阅额度；额外 AI credits 禁用。实际金额未知，不按免费或 DeepSeek 单价推算。今日模型请求 '+v.budget.modelCallsToday+' 次。':'今日社交费用估算/保守预留 ¥'+v.budget.chargedTodayCny.toFixed(4)+'；模型请求 '+v.budget.modelCallsToday+' 次。';
if(document.activeElement.tagName!=='INPUT'){$('daily').value=v.budget.dailyCny;$('weekly').value=v.budget.weeklyCny;$('shared').value=v.budget.sharedBackgroundDailyCny}
const l=v.budget.limits;$('limits').textContent='每平台每天最多 '+l.itemsPerPlatform+' 条，每任务累计 '+l.taskMinutes+' 分钟；每日模型最多 '+l.modelCallsPerDay+' 次；图片输入 '+l.imageInputsPerDay+' 张，视频处理 '+l.videoSecondsPerDay+' 秒；原创素材最多 '+l.generatedImagesPerPost+' 张。'+(v.budget.tokenHardCapSupported?'单次输出 token 设限。':'CLI 无已核验的服务端 token 硬上限，按请求数、60秒和应用层输出字符限制。');
fill('accounts',v.accounts.map(a=>{const n=el('div');n.append(el('p',a.platform+' · '+a.accountId));for(const mode of ['browse','publish'])n.append(el('p',(mode==='browse'?'浏览':'发布')+'：'+(a[mode]?.status||'尚未检查')+(a[mode]?.reason?' · '+a[mode].reason:'')));for(const p of a.posts||[]){const r=el('p',(p.creator||'')+' · '+p.publishedAt+' ');r.append(link(p.url,'查看帖子'));n.append(r)}return n}));
fill('interests',v.interests.length?v.interests.map(i=>el('p',i.topic+' · '+i.stance+' · '+(i.stability==='tentative'?'初步倾向':'不同时间与来源支持')+' · '+i.reason)):[el('p','尚未从自然阅读中形成兴趣记录。')]);
fill('reports',v.reports.length?v.reports.map(r=>el('p',r.at+' · '+r.code+' · '+r.message,'error')):[el('p','没有待处理报告。')]);
fill('tasks',v.tasks.length?v.tasks.map(t=>{const d=el('details'),s=el('summary',(t.kind==='browse'?'浏览':'发布')+' · '+t.period+' · '+(t.result?.sharedQuotaSatisfied?'共享账号本周配额已完成':names[t.status]||t.status));d.append(s,el('p',t.id),el('p','实际来源 '+t.actualSourceCount+' 条；'+(t.reason||t.result?.reason||'')));if(t.result?.url)d.append(link(t.result.url,'已确认帖子'));if(t.draft){d.append(el('h3',t.draft.title),el('pre',t.draft.body),el('p','创作者：'+t.draft.creatorName+' · 指纹：'+t.draft.fingerprint));if(!['confirming','succeeded','cancelled'].includes(t.status)){const b=el('button','取消待发草稿');b.onclick=()=>act({action:'cancel-draft',taskId:t.id});d.append(b)}}return d}):[el('p','尚无日程任务。接入检查不会制造浏览或发布记录。')]);
fill('memories',v.memories.length?v.memories.map(m=>{const d=el('details');d.append(el('summary',m.topic+' · '+m.kind),el('p',m.text),el('p','保留原因：'+m.reason));for(const s of m.sources){const p=el('p',s.author+' · '+s.fetchedAt+' · 实际读取 '+s.readRange.join('、')+' ');p.append(link(s.url,'原始内容'));d.append(p)}if(m.revises)d.append(el('p','修正 '+m.revises+'；依据 '+m.changeReason));return d}):[el('p','尚无已选择的公开长期记忆。')]);}
async function refresh(){try{render(await api('/social/status'));$('error').textContent=data.lastError||'';$('error').hidden=!data.lastError}catch(e){$('error').textContent=e.message;$('error').hidden=false}}
async function act(body){if(working)return;working=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await api('/social/control',body);await refresh()}catch(e){$('error').textContent=e.message;$('error').hidden=false}finally{working=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act({action:b.dataset.action}));
$('budget').onclick=()=>act({action:'budget',dailyCny:Number($('daily').value),weeklyCny:Number($('weekly').value),sharedBackgroundDailyCny:Number($('shared').value)});
(async()=>{try{const r=await fetch('/fish/session',{method:'POST',headers:{'x-qq-console':'1'}});const v=await r.json();if(!r.ok)throw Error(v.error);token=v.token;await refresh();setInterval(()=>{if(!working)void refresh()},30000)}catch(e){$('error').textContent=e.message;$('error').hidden=false}})();
</script></html>
